name: E2E-Full

on:
  workflow_dispatch:
    inputs:
      vllm_ascend_ref:
        description: "vllm-ascend ref (branch, tag, or SHA)"
        required: false
        default: "main"
        type: string
      vllm_version:
        description: "vllm version (commit hash or tag)"
        required: false
        default: "v0.20.2"
        type: string
      partition_size_a2_1card:
        description: "Number of partitions for A2 1-card suite"
        required: false
        default: 2
        type: number
      partition_size_a3_2card:
        description: "Number of partitions for A3 2-card suite"
        required: false
        default: 1
        type: number
      partition_size_a3_4card:
        description: "Number of partitions for A3 4-card suite"
        required: false
        default: 1
        type: number
  schedule:
    - cron: "30 16 * * *"

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
  UV_EXTRA_INDEX_URL: https://repo.huaweicloud.com/ascend/repos/pypi
  UV_INDEX_STRATEGY: unsafe-best-match
  UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
  UV_HTTP_TIMEOUT: 120
  UV_NO_CACHE: 1
  UV_SYSTEM_PYTHON: 1

jobs:
  a2-1card:
    runs-on: linux-aarch64-a2b3-1
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(format('[{0}]', join(range(0, inputs.partition_size_a2_1card || 2), ','))) }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-910b-ubuntu22.04-py3.12
      env:
        VLLM_LOGGING_LEVEL: ERROR
        VLLM_USE_MODELSCOPE: True
        HF_HUB_OFFLINE: 1
        MAX_JOBS: 23
    steps:
      - name: Checkout vllm-ascend
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.vllm_ascend_ref || github.ref }}
          fetch-depth: 0

      - name: Check NPU and CANN info
        run: |
          npu-smi info
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info

      - name: Config mirrors
        run: |
          sed -Ei 's@(ports|archive).ubuntu.com@cache-service.nginx-pypi-cache.svc.cluster.local:8081@g' /etc/apt/sources.list
          pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local
          apt-get update -y
          apt-get install -y python3-pip git gcc g++ cmake libnuma-dev
          pip install uv

      - name: Checkout vllm
        uses: actions/checkout@v6
        with:
          repository: vllm-project/vllm
          ref: ${{ inputs.vllm_version || 'v0.20.2' }}
          path: ./vllm-empty
          fetch-depth: 1

      - name: Install vllm
        working-directory: ./vllm-empty
        run: |
          VLLM_TARGET_DEVICE=empty uv pip install .
          pip uninstall -y triton

      - name: Get csrc hash
        id: get_csrc_hash
        run: |
          CSRC_HASH=$(find ./csrc ./setup.py ./CMakeLists.txt ./cmake \
            -type f -not -path '*/.*' | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "CSRC_HASH=$CSRC_HASH" >> $GITHUB_OUTPUT

      - name: Cache vllm-ascend csrc
        id: cache-csrc
        uses: runs-on/cache@v5
        with:
          path: |
            vllm_ascend/_cann_ops_custom
            vllm_ascend/*.so
            vllm_ascend/lib
            vllm_ascend/include
          key: vllm-ascend-build-v1-${{ runner.os }}-cann-9.0.0-910b-${{ steps.get_csrc_hash.outputs.CSRC_HASH }}
          restore-keys: |
            vllm-ascend-build-v1-${{ runner.os }}-cann-9.0.0-910b-${{ steps.get_csrc_hash.outputs.CSRC_HASH }}

      - name: Install vllm-ascend
        run: |
          pip install uc-manager
          uv pip install -r requirements-dev.txt
          uv pip install --force-reinstall --no-deps triton-ascend==3.2.1
          if find vllm_ascend -maxdepth 1 -name '*.so' -type f 2>/dev/null | grep -q .; then
            COMPILE_CUSTOM_KERNELS=0 uv pip install -e .
          else
            uv pip install -e .
          fi

      - name: Run e2e-pr-a2-1card suite
        working-directory: ./vllm-empty
        env:
          PYTORCH_NPU_ALLOC_CONF: max_split_size_mb:256
          VLLM_WORKER_MULTIPROC_METHOD: spawn
        run: |
          python3 ../.github/workflows/scripts/run_suite.py \
            --config ../.github/workflows/scripts/e2e_pr_suite.yaml \
            --suite e2e-pr-a2-1card \
            --auto-partition-id ${{ matrix.part }} \
            --auto-partition-size ${{ inputs.partition_size_a2_1card || 2 }} \
            --enable-coverage \
            --continue-on-error

      - name: Upload timing data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timing-a2-1card-part${{ matrix.part }}
          path: test_timing_data.json
          retention-days: 14

