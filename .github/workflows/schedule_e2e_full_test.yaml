        run: |
          python3 ../.github/workflows/scripts/run_suite.py \
            --config ../.github/workflows/scripts/e2e_pr_suite.yaml \
            --suite e2e-pr-a3-2card \
            --auto-partition-id ${{ matrix.part }} \
            --auto-partition-size ${{ inputs.partition_size_a3_2card || 1 }} \
            --enable-coverage \
            --continue-on-error

      - name: Run aclgraph_capture_replay (requires triton uninstalled)
        working-directory: ./vllm-empty
        env:
          PYTORCH_NPU_ALLOC_CONF: max_split_size_mb:256
          VLLM_WORKER_MULTIPROC_METHOD: spawn
        run: |
          pip uninstall -y triton-ascend triton
          pytest -sv --durations=0 --color=yes \
            tests/e2e/pull_request/two_card/aclgraph/test_aclgraph_capture_replay.py

      - name: Upload timing data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timing-a3-2card-part${{ matrix.part }}
          path: test_timing_data.json
          retention-days: 14

